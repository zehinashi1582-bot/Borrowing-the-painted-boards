<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>塗板借り受け管理</title>
  <style>
    :root { --ink:#17233d; --muted:#68748b; --line:#e2e6ef; --paper:#6679df; --card:#fff; --green:#287b68; --lime:#d8f8e9; --orange:#f59d0b; --red:#c4515e; --blue:#397ff0; --purple:#8755ed; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(115deg,#6679df,#7650b3); font-family:"Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; }
    header { width:min(1400px,calc(100vw - 24px)); margin:6px auto 0; padding:12px 24px 2px; background:#fff; color:var(--ink); border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .eyebrow { margin:0 0 8px; color:#6173d7; font-size:12px; font-weight:700; letter-spacing:.14em; }
    h1 { margin:0; font-family:"Yu Gothic", "Meiryo", sans-serif; font-size:clamp(18px,2.2vw,24px); font-weight:700; letter-spacing:0; }
    .header-note { max-width:340px; margin:0; color:var(--muted); font-size:13px; line-height:1.7; }
    main { width:min(1400px,calc(100vw - 24px)); margin:0 auto 56px; }
    .summary-panel { padding:0 24px 8px; background:#fff; border-radius:0 0 12px 12px; }
    .panel { margin-top:18px; }
    .toolbar { display:flex; justify-content:flex-end; align-items:center; gap:16px; margin-bottom:3px; }
    .toolbar h2 { margin:0; font-size:20px; }
    .actions, .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    button, input, select { font:inherit; }
    button { border:0; border-radius:4px; padding:11px 15px; cursor:pointer; font-weight:700; box-shadow:0 4px 10px #11182755; transition:transform .18s ease, box-shadow .18s ease, filter .15s ease; }
    .primary { background:var(--green); color:#fff; }
    .loan { display:inline-flex; align-items:center; gap:8px; background:#e4f1e8; color:var(--green); border-radius:22px; padding:10px 16px; }
    .loan::before { content:""; width:10px; height:10px; border-radius:50%; background:currentColor; }
    .loan-row { display:inline-flex; align-items:center; gap:8px; background:#e4f1e8; color:var(--green); border-radius:22px; padding:9px 14px; }
    .loan-row::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
    .status-row { display:inline-flex; align-items:center; gap:6px; border-radius:20px; padding:8px 12px; }
    .status-row::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .status-row.returned { color:#63716a; background:#edf0ef; }
    .status-row.company-returned { color:#37658a; background:#e6f0f8; }
    .status-row.overdue { color:var(--red); background:#fbe7e4; }
    .secondary { height:35px; background:#6479e8; color:#fff; border-radius:8px; padding:5px 12px; font-size:12px; box-shadow:0 4px 10px #6479e833; }
    .outline { background:transparent; color:var(--green); border:1px solid #aabdb0; }
    button:hover { filter:brightness(.96); transform:translateY(-3px); box-shadow:0 9px 18px #11182780; }
      .secondary:hover, .loan-row:hover, .status-row:hover { transform:translateY(-5px); box-shadow:0 12px 24px #080d18aa; }
    button:active { transform:translateY(0); box-shadow:0 3px 6px #11182755; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px; }
    .stat { display:flex; align-items:center; gap:4px; height:35px; background:#f1f2f5; border:0; border-radius:8px; padding:5px 12px; }
    .stat-label { color:#000; font-size:11px; }
    .stat-value { display:inline; margin:0; color:#5575e8; font-size:18px; font-weight:700; }
    .stat-value small { font-size:10px; color:#5575e8; font-weight:400; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; padding:0 12px 12px; }
    .filters { padding:8px 0; border-bottom:1px solid var(--line); }
    .search { flex:1 1 260px; min-width:220px; }
    input, select { border:1px solid #c8d3ca; border-radius:4px; padding:8px 10px; background:#fff; color:var(--ink); }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:separate; border-spacing:0 3px; min-width:900px; }
    th, td { padding:5px 16px; text-align:left; white-space:nowrap; }
    th { color:#3f4a60; background:#d4d8e1; font-size:12px; font-weight:700; }
    th:first-child { border-radius:8px 0 0 8px; }
    th:last-child { border-radius:0 8px 8px 0; }
    td { font-size:14px; background:#fff; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    td:first-child { border-left:1px solid var(--line); border-radius:10px 0 0 10px; }
    td:last-child { border-right:1px solid var(--line); border-radius:0 10px 10px 0; }
    tbody tr:hover td { background:#fbfdf8; }
    .code { color:var(--green); font-weight:700; letter-spacing:.04em; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border-radius:20px; font-size:12px; font-weight:700; }
    .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .available { color:var(--green); background:#d9f5e8; }
    .borrowed { color:#a85f16; background:#fff0d8; }
    .company-loaned { color:#7b5b12; background:#fff5c9; }
    .overdue { color:var(--red); background:#fbe7e4; }
    .returned { color:#63716a; background:#edf0ef; }
    .row-actions { display:flex; gap:6px; }
    .icon-button { padding:7px 10px; background:#eef3ef; color:var(--green); font-size:12px; }
    .empty { padding:56px 20px; text-align:center; color:var(--muted); }
    .table-actions { display:flex; justify-content:flex-end; padding-top:8px; }
    .table-actions .secondary { height:auto; padding:11px 18px; font-size:14px; box-shadow:0 8px 18px #11182766; }
    dialog { width:min(560px,92vw); border:0; padding:0; border-radius:12px; box-shadow:0 18px 60px #19382c33; }
    dialog::backdrop { background:#10251b66; }
    .modal-head { padding:22px 24px; background:#19382c; color:#fff; display:flex; justify-content:space-between; }
    .modal-head h2 { margin:0; font-size:19px; }
    .close { background:transparent; color:#fff; padding:0 4px; font-size:20px; }
    form { padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .code-parts { display:grid; grid-template-columns:1.15fr 1fr 1.35fr 1.35fr; gap:5px; min-width:0; }
    .code-parts input::placeholder { color:#a7b0aa; }
    .loan-code-select { display:none; }
    .loan-field { display:none; }
    label { display:grid; gap:7px; min-width:0; color:var(--muted); font-size:12px; font-weight:700; }
    label input, label select { min-width:0; width:100%; }
    label.full, .form-actions { grid-column:1 / -1; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; padding-top:6px; }
    .toast { position:fixed; right:24px; bottom:24px; padding:14px 18px; color:#fff; background:#19382c; border-radius:4px; opacity:0; transform:translateY(10px); transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; transform:none; }
    button, .secondary, .loan-row, .status-row, .outline, .primary, .icon-button { border-radius:30px; }
    .secondary, .outline, .loan-row, .status-row, .primary, .icon-button { box-shadow:0 4px 10px #11182755; }
    @media (max-width:700px) { header { display:block; } .header-note { margin-top:16px; } main { width:94vw; margin-top:20px; } .toolbar { align-items:flex-start; flex-direction:column; } .stats { grid-template-columns:repeat(2,1fr); } form { grid-template-columns:1fr; } label.full, .form-actions { grid-column:auto; } }
  </style>
</head>
